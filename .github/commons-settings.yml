---
# These settings are synced to GitHub by https://probot.github.io/apps/settings/
repository:

  # Either `true` to make the repository private, or `false` to make it public.
  private: false

  # Either `true` to enable issues for this repository, `false` to disable them.
  has_issues: true

  # Either `true` to enable projects for this repository, or `false` to disable them.
  # If projects are disabled for the organization, passing `true` will cause an API error.
  has_projects: true

  # Either `true` to enable the wiki for this repository, `false` to disable it.
  has_wiki: true

  has_pages: true

  # Either `true` to enable downloads for this repository, `false` to disable them.
  has_downloads: true

  # Updates the default branch for this repository.
  default_branch: develop

  # Merge strategy: squash-merge only.
  # Forcing a single linear-history strategy keeps `develop` clean and makes
  # release-drafter / Conventional-Commits parsing predictable across all
  # repositories that extend these commons.

  # Either `true` to allow squash-merging pull requests, or `false` to prevent
  # squash-merging.
  allow_squash_merge: true

  # Either `true` to allow merging pull requests with a merge commit, or `false`
  # to prevent merging pull requests with merge commits.
  allow_merge_commit: false

  # Either `true` to allow rebase-merging pull requests, or `false` to prevent
  # rebase-merging.
  allow_rebase_merge: false

  delete_branch_on_merge: true


# <!--td-commons-settings-labels-start-->
# Labels: define labels for Issues and Pull Requests
labels:
  - name: bug
    color: "#CC0000"
    description: An issue with the system.

  - name: enhancement
    color: "#336699"
    description: New functionality.

  - name: chore
    color: "#6e70ef"
    description: Maintenance

  - name: fix
    color: "#d73a4a"
    description: Conventional Commits type `fix` — bug fix.

  - name: feat
    color: "#a2eeef"
    description: Conventional Commits type `feat` — new feature.

  - name: docs
    color: "#0075ca"
    description: Conventional Commits type `docs` — documentation or spec change.

  - name: question
    color: "#3ffc8a"
    description: User question

  - name: documentation
    color: "#caa7e8"
    description: Update documentation.

  - name: frontend
    color: "#d876e3"
    description: Touches frontend / UI code (`src/frontend/**`).

  - name: backend
    color: "#0e8a16"
    description: Touches backend / server-side code (`src/backend/**`).

  - name: test
    color: "#f9d0c4"
    description: Touches automated tests.

  - name: security
    color: "#d93f0b"
    description: Security-relevant change or fix.

  - name: cicd
    color: "#fbca04"
    description: ci/cd process functionality.

  - name: project-config
    color: "#ed979d"
    description: Change GitHub project config, keep a extra eye on merge.

  - name: breaking-change
    color: "#fc415d"
    description: Planed braking provider change.

  - name: duplicate
    color: "#cfd3d7"
    description: This issue or pull request already exists.

  - name: dependencies
    color: "#0366d6"
    description: Pull requests that update a dependency file.

  - name: wontfix
    color: "#ffffff"
    description: ""

  - name: automerge
    color: "#19F700"
    description: "Allow automatic Merge."

  - name: spec
    color: "#c5def5"
    description: Touches files under `spec/`.

  - name: skills
    color: "#bfdadc"
    description: Touches files under `skills/`.

  - name: agents
    color: "#c2e0c6"
    description: Touches files under `agents/`.

  - name: claude-code
    color: "#ffd33d"
    description: Touches Claude Code integration (`.claude/`, `.claude-plugin/`, `CLAUDE.md`).

  - name: release
    color: "#5319e7"
    description: Version-alignment PR — excluded from release-drafter changelog.

  - name: github-actions
    color: "#000000"
    description: Touches GitHub Actions workflows under `.github/workflows/`.

  - name: stale
    color: "#cccccc"
    description: Auto-applied by actions/stale to inactive issues and pull requests.

  - name: experimental
    color: "#d4c5f9"
    description: Exploratory work from an `exp/` branch. Excluded from release notes.

  # Named by `exempt-issue-labels` / `exempt-pr-labels` in
  # reusable-stale.yaml, which lists `bug,wip,on-hold`. Neither `wip` nor
  # `on-hold` was ever declared here, so two thirds of that exemption did
  # nothing: an issue parked on purpose was staled anyway unless it happened
  # to be a `bug`. `wip` stays undeclared -- a draft pull request already
  # says the same thing, and stale exempts nothing by draft state.
  - name: on-hold
    color: "#fbca04"
    description: Parked on purpose; excluded from stale automation.

# <!--td-commons-settings-labels-end-->

# No `branches:` key, on purpose: the commons declare no branch protection
# at all (#442 and ADR-005 for `develop`, #481 and ADR-006 for `master`).
# Each consumer declares every protected branch as a complete entry in its
# own .github/settings.yml -- `required_pull_request_reviews`,
# `required_status_checks`, `enforce_admins` and `restrictions: null`.
#
# A commons branch entry can't be right for every consumer:
# - `restrictions.apps` (push restrictions) exists only on
#   organisation-owned repositories. On a user-owned repository, which is
#   every consumer in this portfolio, GitHub rejects the whole update for
#   that branch and the entry applies nothing (GitHub's documented limit;
#   observed for `develop` in #416). The `master` entry carried
#   `nolte-portfolio-app` here from #355 (2026-05-20) until #481.
# - `restrictions: null`, the form the `master` entry had before #355, does
#   apply -- but to a branch most consumers don't have, and alongside any
#   entry a consumer declares for the same branch (next point).
# - The current Settings App source merges `_extends` with
#   @fastify/deepmerge, which ignores the app's `arrayMerge` option and
#   concatenates arrays. A commons entry would then be PUT alongside a
#   consumer's entry of the same name, in parallel, and the last write wins
#   -- with `contexts: []` that can wipe the consumer's required checks.
#   The hosted App behaves as if it merged by `name` today (#442), which
#   hides this; without a commons entry both behaviours give the same
#   result, provided the consumer entry is a complete payload.
#
# The Settings App only updates the branches a configuration lists
# (lib/plugins/branches.js); it never removes protection from a branch that
# is no longer listed. Dropping an entry here therefore removes no live
# protection from any consumer.
