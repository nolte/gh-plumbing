name: Reusable — Terraform Lint

on:
  workflow_call:
    inputs:
      tflint_version:
        description: TFLint release to install, and part of the cache key.
        required: false
        type: string
        default: v0.44.1
      config_path:
        description: |
          Path to the TFLint config that determines which plugins get
          installed. It is part of the cache key, so a consumer whose config
          lives elsewhere must set this -- otherwise `hashFiles` returns the
          empty string and the key stops discriminating on config entirely.
        required: false
        type: string
        default: .tflint.hcl
    secrets:
      token:
        required: true

permissions:
  # The job checks out, restores a cache and runs `tflint --init` / `tflint
  # -f compact`. None of that writes, so the previous `contents: write` plus
  # `pull-requests: write` were two privileges nothing needed.
  contents: read

jobs:
  tflint:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      name: Checkout source code

    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      name: Cache plugin dir
      with:
        path: ~/.tflint.d/plugins
        # The tflint version is in the key because the cached plugin binaries
        # are built against it. Without it, bumping tflint_version silently
        # reused the previous version's plugins -- and a cache hit writes no
        # new entry, so the stale set would have persisted indefinitely.
        key: ${{ matrix.os }}-tflint-${{ inputs.tflint_version }}-${{ hashFiles(inputs.config_path) }}

    - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
      name: Setup TFLint
      with:
        tflint_version: ${{ inputs.tflint_version }}

    - name: Show version
      run: tflint --version

    - name: Init TFLint
      run: tflint --init
      env:
        # https://github.com/terraform-linters/tflint/blob/master/docs/user-guide/plugins.md#avoiding-rate-limiting
        GITHUB_TOKEN: ${{ secrets.token  }}

    - name: Run TFLint
      run: tflint -f compact
