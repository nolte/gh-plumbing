name: Release Deliver to Master

on:
  workflow_call:
    inputs:
      from_branch:
        description: |
          Git ref the presentation branch is reset to -- normally the published
          release tag. Defaults to `github.event.release.tag_name`, which the
          `release` payload actually carries. It previously defaulted to
          `github.event.ref`, a field that payload does NOT carry: the value
          resolved to the empty string on every release, and the old merge step
          silently fell back to the default branch. The presentation branch
          therefore tracked `develop`'s tip rather than the release tag, and
          only looked right because tags are cut at that tip.
        required: false
        default: ${{ github.event.release.tag_name }}
        type: string
      target_branch:
        required: false
        default: master
        type: string
      app-id:
        description: |
          Numeric GitHub App ID of the portfolio App. When set, the
          reusable mints a short-lived installation token from
          `secrets.app-private-key` and uses it for the master fast-
          forward. When empty (the default), the reusable falls
          through to `secrets.token` — typically the consumer's
          `GITHUB_TOKEN`. After Phase 2 of issue #330 lands its
          push-restriction (`restrictions.apps: [<app-slug>]`) on
          master, `GITHUB_TOKEN` no longer has the right to push to
          master and the App token is mandatory.
        required: false
        type: string
        default: ""
    secrets:
      token:
        required: true
      app-private-key:
        description: |
          PEM-encoded private key for the App identified by `inputs.app-id`.
          Required when `app-id` is set; ignored otherwise.
        required: false
# Explicit permissions per spec/project/github-actions-best-practices §B:
# workflow level is the minimum, write scopes are granted per job.
permissions:
  contents: read


# Every run of this workflow updates the same presentation branch, so two
# releases published close together race on one target. The group is static
# rather than ref-derived on purpose: the contended resource is the target
# branch, not the ref that triggered the run, and two runs from different tags
# still collide. Matches the `release-publish` group in
# reusable-release-publish.yml.
#
# cancel-in-progress stays false per spec/project/github-actions-best-practices
# §F: a delivery workflow must never cancel an in-flight run.
concurrency:
  group: release-cd-refresh-master
  cancel-in-progress: false


jobs:
  refresh_presentation_branch:
    permissions:
      contents: write # fast-forwards the presentation branch
    name: "Publish the the Release to Master"
    runs-on: ubuntu-latest
    steps:
      # Mint an App installation token only when the caller has set
      # inputs.app-id. The output token replaces secrets.token for the
      # checkout and the push via the
      # `steps.app-token.outputs.token || secrets.token` fallback.
      - name: Mint App installation token
        id: app-token
        if: ${{ inputs.app-id != '' }}
        # Tolerate a half-configured setup. On any failure outputs.token
        # is empty and the fallback to secrets.token kicks in — note
        # that on a protected master with `restrictions.apps`, the
        # fallback will fail at push time; the operator must complete
        # Phase 0 (variable + secret) before this workflow can
        # succeed on a fully-restricted master.
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-private-key }}

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history plus tags: the reset resolves an arbitrary ref to a
          # commit, which a shallow clone cannot do.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.token }}

      # A single write strategy cannot serve every presentation branch, because
      # real consumer configurations forbid opposite things (issue #414):
      #
      #   linear history  -> no merge commits  -> the merge is rejected
      #   no force pushes -> no rewrite        -> the reset is rejected
      #
      # ADR-001 chose the reset to solve the first and did not consider the
      # second. `gh-plumbing`'s own master is the second case, which is why
      # v2.0.0 and v2.0.1 both published green while master stayed on v1.1.26.
      #
      # So the strategy is read from the target rather than assumed. Both
      # mechanisms have to be consulted -- classic protection and rulesets are
      # independent, and either can forbid either operation.
      - name: Determine the write strategy from the target's protection
        id: strategy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.token }}
          TARGET: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          # An unreadable endpoint must not read as "unrestricted": that is the
          # mistake the branch-protection audit made (#421). Unknown means the
          # restriction is assumed to be present, so the run degrades to a
          # refusal with a diagnosis rather than a rejected push.
          classic=$(gh api "repos/${GITHUB_REPOSITORY}/branches/${TARGET}/protection" 2>/dev/null || echo '')
          rules=$(gh api "repos/${GITHUB_REPOSITORY}/rules/branches/${TARGET}" 2>/dev/null || echo '[]')

          rule_types=$(echo "$rules" | jq -r '[.[]?.type] | unique | join(",")')

          # `pull_request` blocks every direct write, merge and reset alike.
          blocks_direct=$(echo "$rules" | jq -r 'any(.[]?; .type == "pull_request")')
          # Force push: classic `allow_force_pushes`, and the `non_fast_forward`
          # rule which forbids any history rewrite.
          rule_no_force=$(echo "$rules" | jq -r 'any(.[]?; .type == "non_fast_forward")')
          classic_force=$(echo "${classic:-{\}}" | jq -r '.allow_force_pushes.enabled // false')
          # Merge commits: classic and ruleset linear-history both forbid them.
          rule_linear=$(echo "$rules" | jq -r 'any(.[]?; .type == "required_linear_history")')
          classic_linear=$(echo "${classic:-{\}}" | jq -r '.required_linear_history.enabled // false')

          force_ok=false
          [ "$classic_force" = "true" ] && [ "$rule_no_force" != "true" ] && force_ok=true
          merge_ok=false
          [ "$classic_linear" != "true" ] && [ "$rule_linear" != "true" ] && merge_ok=true

          if [ "$blocks_direct" = "true" ]; then
            mode=blocked
            reason="a \`pull_request\` ruleset rule requires every change to arrive through a pull request, so neither a merge nor a reset may be pushed directly"
          elif [ "$merge_ok" = "true" ]; then
            # Preferred over the reset when both are available: it adds to the
            # branch instead of rewriting it, so a consumer holding anything on
            # the presentation branch does not lose it.
            mode=merge
            reason="merge commits are permitted"
          elif [ "$force_ok" = "true" ]; then
            mode=reset
            reason="merge commits are forbidden, force pushes are permitted"
          else
            mode=blocked
            reason="the target forbids merge commits and force pushes alike"
          fi

          {
            echo "mode=$mode"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          echo "Strategy for '${TARGET}': ${mode} -- ${reason}"
          echo "  classic protection readable: $([ -n "$classic" ] && echo yes || echo 'no (absent or unreadable)')"
          echo "  ruleset rules: ${rule_types:-(none)}"

      - name: Refresh the presentation branch
        id: refresh
        if: steps.strategy.outputs.mode != 'blocked'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.token }}
          FROM_REF: ${{ inputs.from_branch }}
          TARGET: ${{ inputs.target_branch }}
          MODE: ${{ steps.strategy.outputs.mode }}
        run: |
          set -euo pipefail

          # Fail loudly rather than defaulting. An empty ref is what made the
          # old behaviour wrong-but-green for every release so far.
          if [ -z "${FROM_REF}" ]; then
            echo "::error::from_branch resolved to an empty value. On a release" \
                 "trigger it defaults to github.event.release.tag_name; on a" \
                 "manual run, pass the tag explicitly." >&2
            exit 1
          fi

          git fetch --force --tags --prune origin

          # Accept a tag, a branch or a raw SHA, in that order of preference.
          SOURCE_SHA="$(
            git rev-parse --verify --quiet "refs/tags/${FROM_REF}^{commit}" ||
            git rev-parse --verify --quiet "refs/remotes/origin/${FROM_REF}^{commit}" ||
            git rev-parse --verify --quiet "${FROM_REF}^{commit}"
          )" || {
            echo "::error::Could not resolve '${FROM_REF}' to a commit." >&2
            exit 1
          }

          EXPECTED="$(git ls-remote origin "refs/heads/${TARGET}" | awk '{print $1}')"

          if [ -z "${EXPECTED}" ]; then
            echo "Target branch '${TARGET}' does not exist yet; creating it."
            git push origin "${SOURCE_SHA}:refs/heads/${TARGET}"
            action="created"
          elif [ "${EXPECTED}" = "${SOURCE_SHA}" ]; then
            echo "Target branch '${TARGET}' already points at ${SOURCE_SHA}; nothing to do."
            action="already current"
          elif [ "${MODE}" = "merge" ]; then
            # The /merges API, the mechanism that worked before #404 and still
            # works wherever merge commits are allowed. It is additive, so the
            # target keeps whatever it already carries.
            if ! out=$(gh api "repos/${GITHUB_REPOSITORY}/merges" \
                         -f base="${TARGET}" -f head="${SOURCE_SHA}" \
                         -f commit_message="chore(release): refresh ${TARGET} to ${FROM_REF}" 2>&1); then
              echo "::error::Merging ${FROM_REF} into '${TARGET}' failed even though the target reports that merge commits are permitted. The protection may have changed since the check, or the token may lack write access. Response: ${out}" >&2
              exit 1
            fi
            action="merged"
          else
            # --force-with-lease, not --force: if another run advanced the
            # target between the read above and this push, the push aborts
            # instead of discarding that run's work. The concurrency group on
            # this workflow makes that unlikely; the lease makes it safe.
            git push --force-with-lease="${TARGET}:${EXPECTED}" \
              origin "${SOURCE_SHA}:refs/heads/${TARGET}"
            action="reset"
          fi

          {
            echo "### Presentation branch refreshed"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Strategy | \`${MODE}\` (${action}) |"
            echo "| Source ref | \`${FROM_REF}\` |"
            echo "| Source commit | \`${SOURCE_SHA}\` |"
            echo "| Target branch | \`${TARGET}\` |"
            echo "| Previous target commit | \`${EXPECTED:-<branch did not exist>}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

      # Failing loudly is the point. The cascade previously left a stale
      # presentation branch behind a green release, which is how v2.0.0 went
      # unnoticed for six weeks. A target this workflow cannot write to is a
      # configuration decision the operator has to make, not something to
      # paper over.
      - name: "Refuse: no permitted write path"
        if: steps.strategy.outputs.mode == 'blocked'
        env:
          TARGET: ${{ inputs.target_branch }}
          FROM_REF: ${{ inputs.from_branch }}
          REASON: ${{ steps.strategy.outputs.reason }}
        run: |
          set -euo pipefail
          msg="Cannot refresh '${TARGET}' to ${FROM_REF}: ${REASON}. Grant the release App a bypass actor on the target's ruleset, relax the rule, or stop refreshing this branch and point consumers at the release tag instead (issue #414, ADR-001)."
          echo "::error::${msg}" >&2
          {
            echo "### Presentation branch NOT refreshed"
            echo
            echo "${msg}"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Target branch | \`${TARGET}\` |"
            echo "| Source ref | \`${FROM_REF}\` |"
            echo "| Reason | ${REASON} |"
          } >> "${GITHUB_STEP_SUMMARY}"
          exit 1
