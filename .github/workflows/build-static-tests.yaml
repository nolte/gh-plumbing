name: Static CI Tests

on:
  push:
  workflow_dispatch:
# Explicit permissions per spec/project/github-actions-best-practices §B:
# workflow level is the minimum, write scopes are granted per job.
permissions:
  contents: read


# Pre-merge feedback, so cancel-in-progress is true: a superseded run on the
# same ref has nothing left to tell us and only delays the run that matters.
# This is the §F SHOULD, not the MUST -- the four jobs below are read-only and
# would not corrupt anything by overlapping, they would merely waste a runner.
#
# This block lives in the wrapper rather than in the four reusables it calls.
# Putting it in each reusable would give all four the same group and serialise
# them against each other, turning a parallel fan-out into a queue. Consumers
# copying this wrapper should carry the block with it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Stage omissions, declared rather than left silent: this repository ships
# configuration only -- no application code and no build artifact -- so the
# canonical test and package stages have nothing to run and are left out
# deliberately. The four jobs below are the lint, docs, and securing stages.
#
# The jobs reference their reusables by LOCAL PATH, not by `nolte/gh-plumbing/
# ...@<ref>`. A local path resolves against the current commit, so a pull
# request that changes a reusable is verified by its own checks. With `@develop`
# these checks ran develop's copy instead: a pull request could go green on all
# contexts having executed none of its own changes, and nothing in the output
# said so. See ADR-001's sibling decision on issue #392.
#
# Consumers cannot copy this form -- the file lives in another repository. The
# consumer pattern is `@<tag>` and is documented under docs/*/workflows/.
jobs:
  actionlint:
    permissions:
      contents: read
      # Required, not optional. The called workflow's job asks for
      # `checks: write` so reviewdog can report findings inline. A caller that
      # does not grant it does not get a downgraded token -- GitHub refuses to
      # start the workflow at all, with `startup_failure` and no jobs. Consumers
      # calling reusable-actionlint must grant this too.
      checks: write
    uses: ./.github/workflows/reusable-actionlint.yaml
    with:
      # actionlint 1.7.12, the latest release and the one reviewdog bundles,
      # doesn't know the `job.workflow_repository` / `job.workflow_sha` context
      # properties GitHub documents for a reusable workflow checking out its own
      # source (docs: Contexts reference, `job` context). reusable-pr-lint.yaml
      # needs exactly those. The pattern stays space-free because the action
      # word-splits this input unquoted, so `\s` stands for each space. It matches
      # only the `job` object type's message for those two names; a misspelled
      # `github.job_workflow_sha` elsewhere is still reported. Drop it once
      # actionlint knows them.
      actionlint_flags: -ignore="workflow_(repository|sha)"\sis\snot\sdefined\sin\sobject\stype\s\{check_run_id
  static:
    uses: ./.github/workflows/reusable-pre-commit.yaml
  docs:
    uses: ./.github/workflows/reusable-mkdocs-build.yaml
  security:
    permissions:
      contents: read
      security-events: write # reusable-trivy uploads SARIF to the Security tab
      actions: read # required by upload-sarif on private repositories
    uses: ./.github/workflows/reusable-trivy.yaml
  # The checker behind reusable-pr-lint.yaml is Python with its own tests; they
  # run here so a pull request that changes the rules is judged by them.
  pr-lint-tests:
    uses: ./.github/workflows/reusable-python-coverage.yaml
    with:
      working-directory: scripts/pr-lint
      install-command: pip install pytest==9.1.1 pytest-cov==7.1.0
      coverage-source: check_pr_body
      pytest-args: tests
  chain-bench:
    uses: ./.github/workflows/reusable-chain-bench.yaml
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
