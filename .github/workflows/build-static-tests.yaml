name: Static CI Tests

# `pull_request` is what makes the required contexts report on fork pull
# requests: a fork never pushes to this repository, so with a push-only trigger
# `static / Static CI Tests`, `docs / MkDocs Build` and `actionlint / Workflow
# Lint` never reported there and the pull request stayed blocked (#461, #462).
# `push` is narrowed to develop and master so a same-repository branch with an
# open pull request doesn't run the bundle twice. `pull_request_target` is
# deliberately NOT used: by default it checks out the base ref, so the checks
# would go green without testing the pull request's changes, and checking out
# the head explicitly would run fork code with the base repository's write
# token and secrets. The flip side -- under `pull_request` a fork runs its own
# copy of this file and could edit the jobs until they pass -- is what the
# required `fork-guard` commit status refuses (fork-guard.yaml, #465).
on:
  pull_request:
  push:
    branches: [develop, master]
  workflow_dispatch:
# Explicit permissions per spec/project/github-actions-best-practices §B:
# workflow level is the minimum, write scopes are granted per job.
permissions:
  contents: read


# Pre-merge feedback, so cancel-in-progress is true: a superseded run on the
# same ref has nothing left to tell us and only delays the run that matters.
# Pull-request runs group by `refs/pull/N/merge`, so each pull request has its
# own group, separate from the develop and master pushes.
# This is the §F SHOULD, not the MUST -- the four jobs below are read-only and
# would not corrupt anything by overlapping, they would merely waste a runner.
#
# This block lives in the wrapper rather than in the four reusables it calls.
# Putting it in each reusable would give all four the same group and serialise
# them against each other, turning a parallel fan-out into a queue. Consumers
# copying this wrapper should carry the block with it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Stage omissions, declared rather than left silent: this repository ships
# configuration only -- no application code and no build artifact -- so the
# canonical test and package stages have nothing to run and are left out
# deliberately. The four jobs below are the lint, docs, and securing stages.
#
# The jobs reference their reusables by LOCAL PATH, not by `nolte/gh-plumbing/
# ...@<ref>`. A local path resolves against the current commit, so a pull
# request that changes a reusable is verified by its own checks. With `@develop`
# these checks ran develop's copy instead: a pull request could go green on all
# contexts having executed none of its own changes, and nothing in the output
# said so. See ADR-001's sibling decision on issue #392.
#
# Consumers cannot copy this form -- the file lives in another repository. The
# consumer pattern is `@<tag>` and is documented under docs/*/workflows/.
jobs:
  actionlint:
    # The called workflow needs `contents: read` only. A caller that grants
    # less than a called job asks for does not get a downgraded token --
    # GitHub refuses to start the workflow with `startup_failure` and no jobs.
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-actionlint.yaml
    with:
      # actionlint 1.7.12, the latest release and the one reviewdog bundles,
      # doesn't know the `job.workflow_repository` / `job.workflow_sha` context
      # properties GitHub documents for a reusable workflow checking out its own
      # source (docs: Contexts reference, `job` context). reusable-pr-lint.yaml
      # needs exactly those. The pattern stays space-free because the action
      # word-splits this input unquoted, so `\s` stands for each space. It matches
      # only the `job` object type's message for those two names; a misspelled
      # `github.job_workflow_sha` elsewhere is still reported. Drop it once
      # actionlint knows them.
      actionlint_flags: -ignore="workflow_(repository|sha)"\sis\snot\sdefined\sin\sobject\stype\s\{check_run_id
  static:
    uses: ./.github/workflows/reusable-pre-commit.yaml
  docs:
    uses: ./.github/workflows/reusable-mkdocs-build.yaml
  security:
    permissions:
      contents: read
      security-events: write # reusable-trivy uploads SARIF to the Security tab
      actions: read # required by upload-sarif on private repositories
    uses: ./.github/workflows/reusable-trivy.yaml
  # The checker behind reusable-pr-lint.yaml is Python with its own tests; they
  # run here so a pull request that changes the rules is judged by them.
  pr-lint-tests:
    uses: ./.github/workflows/reusable-python-coverage.yaml
    with:
      working-directory: scripts/pr-lint
      install-command: pip install pytest==9.1.1 pytest-cov==7.1.0
      coverage-source: check_pr_body
      pytest-args: tests
  # The branch-protection audit is Python too, and its verdicts are the kind
  # nobody re-derives by hand -- #421 was the audit contradicting its own detail
  # lines for six weeks' worth of runs. Tested here for the same reason as the
  # pr-lint checker above.
  audit-tests:
    uses: ./.github/workflows/reusable-python-coverage.yaml
    with:
      working-directory: scripts
      install-command: pip install pytest==9.1.1 pytest-cov==7.1.0
      coverage-source: branch_protection_audit
      # Named explicitly rather than `tests`, which would run every suite in
      # the directory and report their lines against this job's coverage
      # source. One job per script keeps each percentage meaningful.
      pytest-args: tests/test_branch_protection_audit.py
  # Same reasoning as the two jobs above: the freshness check reports on
  # documentation nobody re-reads, so a silent regression in it would go
  # unnoticed exactly as long as #421 did.
  docs-freshness-tests:
    uses: ./.github/workflows/reusable-python-coverage.yaml
    with:
      working-directory: scripts
      install-command: pip install pytest==9.1.1 pytest-cov==7.1.0
      coverage-source: docs_freshness
      pytest-args: tests/test_docs_freshness.py
  # Guards the class behind #462: a required context whose workflow never runs
  # on a fork pull request leaves it blocked without any failed check. The
  # suite includes a run against this repository's own settings.yml and
  # workflows, so a push-only or write-scoped producer fails here. PyYAML comes
  # from the hash-pinned requirements-audit.txt, the same artefact the audit
  # workflow installs, rather than from a second, unhashed pin.
  #
  # The same job runs the guard behind #471: every actions/checkout step must
  # decide `persist-credentials` explicitly, and a `true` must name the later
  # step that needs the token. It shares this job because the job is a required
  # context (`required-check-triggers-tests / Python Coverage`), so the guard
  # blocks a merge without a new context in settings.yml. The second `--cov`
  # keeps a separate coverage line per script.
  #
  # tests/test_setup_vale.py and tests/test_release_publish_vale.py ride along
  # for the same reason (#488): the first drives actions/setup-vale's shell,
  # which downloads and runs a binary, through its refusals offline; the second
  # runs the release-notes step of reusable-release-publish.yml against stubs,
  # so a download failure keeps warning and a checksum mismatch keeps failing
  # the publish. Coverage can't measure shell, so they add no coverage line,
  # only the verdict. tests/test_vale_version.py covers the pre-commit guard
  # that keeps .vale-version and .tool-versions in agreement, with its own
  # coverage line. tests/test_builtin_action_cache.py does the same for the
  # pre-commit guard behind #494, which refuses a setup action whose built-in
  # cache would save in its post step.
  #
  # The guard behind #492 rides along for the same reason as #471's: every
  # workflow command and env-file write in a reusable workflow or composite
  # action must print only masked or constrained values, with its own
  # coverage line. tests/test_workflow_command_injection.py runs the repaired
  # steps against hostile values; like the Vale steps it drives shell, so it
  # adds no coverage line.
  required-check-triggers-tests:
    uses: ./.github/workflows/reusable-python-coverage.yaml
    with:
      working-directory: scripts
      install-command: pip install --require-hashes --no-deps -r requirements-audit.txt && pip install pytest==9.1.1 pytest-cov==7.1.0
      coverage-source: required_check_triggers
      pytest-args: --cov=checkout_credentials tests/test_required_check_triggers.py tests/test_checkout_credentials.py tests/test_setup_vale.py tests/test_release_publish_vale.py --cov=vale_version tests/test_vale_version.py --cov=builtin_action_cache tests/test_builtin_action_cache.py --cov=workflow_command_masking tests/test_workflow_command_masking.py tests/test_workflow_command_injection.py
  # The check itself, not its tests. It runs on the pull request so a page
  # added in one language only, or a reference to a workflow that no longer
  # exists, fails here rather than reaching a release.
  docs-freshness:
    uses: ./.github/workflows/reusable-docs-freshness.yaml
  chain-bench:
    uses: ./.github/workflows/reusable-chain-bench.yaml
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
