name: Spelling Check

on:
  workflow_call:
# Explicit permissions per spec/project/github-actions-best-practices §B:
# workflow level is the minimum, write scopes are granted per job.
permissions:
  contents: read # reviewdog's default github-pr-annotations reporter emits workflow
                  # commands rather than calling the API, so no write scope is needed


jobs:
  vale:
    name: runner / vale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: errata-ai/vale-action@85f9f7f2c5f449ac0ae5b66662961bae3f77ca6a # v2.1.2
        with:
          # The action's `version` input defaults to `latest`, so this check ran
          # whatever Vale had shipped that morning -- 3.21.0 on 2026-09-13, while
          # `.tool-versions` and reusable-release-publish.yml both say 3.15.2.
          # A floating linter can change its verdict on an unchanged file, and a
          # rule added upstream fires here while staying invisible locally. That
          # is not hypothetical: #432 was clean locally at error level and red in
          # CI on the same files minutes later (#433).
          #
          # Pinned in lock-step with `.tool-versions`. Bump both together, and
          # the release-notes gate in reusable-release-publish.yml with them.
          version: "3.15.2"
          # The action defaults to `fail_on_error: false`, so this check was
          # green by construction: #403 introduced three errors on added lines
          # and it still passed. A signal that reads as a gate and is not one is
          # worse than no signal, which is the same conclusion #398 reached for
          # workflow validity.
          fail_on_error: true
          # `added` is the action's default and is kept deliberately, unlike the
          # actionlint reusable where `nofilter` is right. Prose findings are
          # noisier than syntax errors, and existing documentation debt should
          # not block an unrelated pull request -- an author is answerable for
          # the lines they wrote.
          filter_mode: added
          # Errors only. Warnings and suggestions stay visible as annotations
          # without failing the run.
          level: error
