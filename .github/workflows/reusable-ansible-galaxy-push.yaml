name: Publishing Ansible Galaxy Role

on:
  workflow_call:
    secrets:
      galaxy_api_key:
        required: true
# Explicit permissions per spec/project/github-actions-best-practices §B:
# workflow level is the minimum, write scopes are granted per job.
permissions:
  contents: read # checkout only; the Galaxy push authenticates with its own API key


jobs:
  molecule:
    name: "Push Role"
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: galaxy
        uses: robertdebock/galaxy-action@7d89099e09f4385ec4b53eb58c0d120f1ad806dd # 1.2.1
        with:
          galaxy_api_key: ${{ secrets.galaxy_api_key }}
