name: Release Deliver to Master

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: |
          Tag to fast-forward master to (e.g. v1.1.15). Use as a manual
          escape hatch when the release:published cascade did not fire
          under GITHUB_TOKEN — see spec/project/workflow-health/
          §Known platform constraints.
        required: true
        type: string
# Explicit permissions per spec/project/github-actions-best-practices §B:
# workflow level is the minimum, write scopes are granted per job.
permissions:
  contents: read


# This wrapper pushes a fast-forward merge to master through
# the force-with-lease push. After Phase 2 of issue #330 lands its
# push-restriction (`restrictions.apps: [nolte-portfolio-app]`) on
# master, `GITHUB_TOKEN` no longer has the right to push to master —
# the App token is now mandatory. Forwarding `vars.PORTFOLIO_APP_ID`
# and `secrets.PORTFOLIO_APP_PRIVATE_KEY` into the reusable lets it
# mint a short-lived installation token at job start.
#
# Backwards compatibility: when `vars.PORTFOLIO_APP_ID` is unset, the
# reusable skips the mint step and falls through to `secrets.token`
# (= GITHUB_TOKEN). On an organisation-owned consumer whose master is
# also restricted via the inherited commons, the GITHUB_TOKEN push
# would fail — the operator must complete Phase 0 first.

jobs:
  refresh_presentation_branch:
    permissions:
      contents: write # the called workflow pushes to the presentation branch
    uses: ./.github/workflows/reusable-release-cd-refresh-master.yml
    with:
      # github.event.release.tag_name, not github.event.ref: the release
      # payload carries no top-level `ref`, so the old expression resolved
      # to the empty string on every release-triggered run.
      from_branch: ${{ inputs.tag || github.event.release.tag_name }}
      app-id: ${{ vars.PORTFOLIO_APP_ID }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      app-private-key: ${{ secrets.PORTFOLIO_APP_PRIVATE_KEY }}
