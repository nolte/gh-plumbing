name: Reusable — Docker Lint & Dry-Build

on:
  workflow_call:
    inputs:
      context:
        description: Build context passed to docker/build-push-action.
        required: false
        type: string
        default: "."
      dockerfile:
        description: Path to the Dockerfile relative to the repository root.
        required: false
        type: string
        default: "Dockerfile"
      platforms:
        description: |
          Comma-separated list of target platforms. Single-arch is the
          default to keep PR feedback fast; multi-arch is reserved for the
          publish workflow.
        required: false
        type: string
        default: "linux/amd64"
      hadolint_config:
        description: |
          Optional path to a hadolint config file (.hadolint.yaml). Empty
          means "use hadolint defaults".
        required: false
        type: string
        default: ""

jobs:
  hadolint:
    name: Lint ${{ inputs.dockerfile }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: ${{ inputs.dockerfile }}
          config: ${{ inputs.hadolint_config }}

  build:
    name: Dry-build ${{ inputs.dockerfile }}
    # No `needs: hadolint`: the two are independent checks, and gating the
    # build on the lint meant a hadolint finding hid a broken build until the
    # next push. One run should surface every class of problem.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up QEMU
        if: contains(inputs.platforms, ',')
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
