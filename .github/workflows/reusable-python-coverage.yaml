name: Reusable — Python Coverage

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version passed to actions/setup-python.
        required: false
        type: string
        # Concrete rather than "3.x": a floating interpreter means the same
        # commit can resolve differently over time, and .tool-versions already
        # pins 3.14 for local work. Consumers override via this input.
        default: "3.14"
      working-directory:
        description: Directory the install and test commands run in.
        required: false
        type: string
        default: "."
      install-command:
        description: |
          Shell command that installs the project together with its test
          dependencies (must include pytest and pytest-cov).
        required: false
        type: string
        default: "pip install -e .[test]"
      coverage-source:
        description: |
          Module or package measured for coverage, passed to pytest as
          --cov=<source>.
        required: false
        type: string
        default: "."
      pytest-args:
        description: Extra arguments appended to the pytest invocation.
        required: false
        type: string
        default: ""
      fail-under:
        description: |
          Minimum total coverage percentage. The job fails below it.
          0 disables the gate.
        required: false
        type: number
        default: 0

jobs:
  coverage:
    name: Python Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Run pytest with coverage
        run: |
          pytest \
            --cov=${{ inputs.coverage-source }} \
            --cov-report=term-missing \
            --cov-report=xml \
            ${{ inputs.pytest-args }}

      - name: Render coverage into the job summary
        if: ${{ !cancelled() }}
        run: |
          # Encode, then wrap, for the step summary (#506): control characters
          # become '?', ASCII punctuation a numeric HTML entity, inside <code>
          # (md_code) or <pre> (md_pre, line ends kept). Caller and repository
          # text then renders as text and links nothing.
          md_enc() { local s="${1//[[:cntrl:]]/?}" o="" c i; local LC_ALL=C; for ((i = 0; i < ${#s}; i++)); do c="${s:i:1}"; [[ "$c" == [[:punct:]] ]] && printf -v c '&#%d;' "'$c"; o+="$c"; done; printf '%s' "$o"; }
          md_code() { printf '<code>%s</code>' "$(md_enc "$1")"; }
          md_pre() { local line; printf '<pre>'; while IFS= read -r line; do md_enc "${line%$'\r'}"; printf '\n'; done <<< "$1"; printf '</pre>\n'; }
          # The report quotes the consumer's file names: captured as plain
          # text and written as one <pre> block, not appended as Markdown.
          report=$(coverage report --format=text)
          {
            echo "## Test coverage"
            echo
            md_pre "$report"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce coverage threshold
        if: ${{ inputs.fail-under > 0 }}
        run: coverage report --fail-under=${{ inputs.fail-under }}
