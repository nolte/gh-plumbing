name: Reusable — Sphinx Deploy

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Used Python version'
        required: false
        default: "3.8"
        type: string
      scenario-name:
        description: 'Name from the Tox szenario for generate the docs'
        required: false
        default: "docs"
        type: string
      generated-docs-folder:
        description: 'Folder with with generated docs'
        required: false
        default: ".tox/docs/tmp/html"
        type: string
    secrets:
      token:
        required: true
# Explicit permissions per spec/project/github-actions-best-practices §B:
# workflow level is the minimum, write scopes are granted per job.
permissions:
  contents: read


jobs:
  publish_docs:
    permissions:
      contents: write # github-pages-deploy-action pushes the built site to gh-pages
    name: "Publish the HTML Documentation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ inputs.python-version }}
          architecture: 'x64'

      - name: Install dependencies
        run: |
          # Version-pinned rather than unbounded: continuous-integration §C
          # forbids an unbounded range in a pipeline definition, and an
          # unpinned tox is exactly how a green pipeline turns red without a
          # commit. Renovate bumps these as reviewable pull requests.
          python -m pip install --upgrade pip
          pip install 'tox==4.58.0' 'tox-gh-actions==3.5.0'

      - name: Test with tox
        run: tox -e ${{ inputs.scenario-name }}

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@4a3abc783e1a24aeb44c16e869ad83caf6b4cc23 # v4.7.4
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: ${{ inputs.generated-docs-folder }}
          token: ${{ secrets.token }}
