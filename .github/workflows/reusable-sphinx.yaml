name: Reusable — Sphinx Deploy

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Used Python version'
        required: false
        default: "3.8"
        type: string
      scenario-name:
        description: 'Name from the Tox szenario for generate the docs'
        required: false
        default: "docs"
        type: string
      generated-docs-folder:
        description: 'Folder with with generated docs'
        required: false
        default: ".tox/docs/tmp/html"
        type: string
    secrets:
      token:
        required: true

jobs:
  publish_docs:
    name: "Publish the HTML Documentation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ inputs.python-version }}
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox tox-gh-actions

      - name: Test with tox
        run: tox -e ${{ inputs.scenario-name }}

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@4a3abc783e1a24aeb44c16e869ad83caf6b4cc23 # v4.7.4
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: ${{ inputs.generated-docs-folder }}
          token: ${{ secrets.token }}
