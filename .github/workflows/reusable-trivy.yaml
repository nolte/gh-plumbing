name: Reusable — Trivy Security Scan

on:
  workflow_call:

jobs:
  build:
    name: Build
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          # `format: sarif` is native. The previous `format: template` plus
          # `template: '@/contrib/sarif.tpl'` only still worked through a Trivy
          # compatibility shim -- sarif.tpl was removed from
          # aquasecurity/trivy/contrib, and every run logged
          # "Using --template sarif.tpl is deprecated".
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: 'trivy-results.sarif'
