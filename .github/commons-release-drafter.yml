---
# Portfolio-wide release-drafter commons. Every repository extends this via
# `_extends: gh-plumbing:.github/commons-release-drafter.yml`, so a change here
# reaches the whole portfolio on the next Probot sync.

# $RESOLVED_VERSION, not $NEXT_PATCH_VERSION. Before the resolver below existed
# every release was a patch regardless of what landed, so a `breaking-change`
# label had no effect on the version. That combination is worse than it sounds:
# consumers pin by tag and update through Renovate, and a patch bump is the
# update class most likely to be automerged or waved through -- so the change
# least likely to be scrutinised was the one carrying the break.
name-template: v$RESOLVED_VERSION
tag-template: v$RESOLVED_VERSION

version-resolver:
  major:
    labels:
      - breaking-change
  minor:
    labels:
      - feat
      - enhancement
  patch:
    labels:
      - fix
      - bug
      - chore
      - docs
      - documentation
      - project-config
      - cicd
      - dependencies
      - security
  default: patch

branches:
  - master
  - develop

# The label lists carry both the Conventional-Commits labels the portfolio
# actually applies (`feat`, `fix`) and the GitHub defaults (`enhancement`,
# `bug`). Previously the categories matched only the defaults, so a PR labelled
# `fix` -- the portfolio convention -- fell into the uncategorised remainder of
# the changelog and never appeared under a heading.
categories:
  - title: 🚀 Features
    labels:
      - "feat"
      - "enhancement"
  - title: 🐛 Bug Fixes
    labels:
      - "fix"
      - "bug"
  # Only labels that are a category in their own right. `project-config`,
  # `cicd` and `dependencies` used to sit here too, and they are *area* labels
  # -- boring-cyborg derives them from the touched paths, so they co-occur with
  # a type label rather than replacing it. release-drafter lists a pull request
  # under every matching category, so `fix(workflows):` appeared under both Bug
  # Fixes and Maintenance, and `fix(vale):` under three headings at once (#413).
  - title: 🧰 Maintenance
    labels:
      - "chore"
      # `docs` and `documentation` are the labels that exist; the previous
      # `documentations` entry matched nothing in any portfolio repository.
      - "docs"
      - "documentation"

autolabeler:
  # Derive the type label from the title, so every pull request carries exactly
  # one and the categories above always find it. Without this the type label was
  # applied by hand and the result was arbitrary: of twelve consecutive merges,
  # #415 carried `fix` *and* `chore` (two categories), #418 was a `feat(...)`
  # carrying only `chore` (filed under Maintenance), and #420 carried no type
  # label at all (the uncategorised remainder). Deriving it removes all three
  # shapes at once, and is what makes reducing Maintenance above safe: a pull
  # request touching only `.github/workflows/**` still lands under its type.
  #
  # `chore(release):` matches both this and the `release` rule below; that is
  # intended, since `release` is an exclude-label and wins by removing the entry
  # from the notes entirely.
  - label: "feat"
    title:
      - '/^feat(\(.+\))?!?:/'
  - label: "fix"
    title:
      - '/^fix(\(.+\))?!?:/'
  - label: "chore"
    title:
      - '/^chore(\(.+\))?!?:/'
  - label: "docs"
    title:
      - '/^docs(\(.+\))?!?:/'
  - label: "release"
    title:
      - '/^chore\(release\):/'
  # Exploratory work is not something a consumer shipped, so it does not belong
  # in the changelog. Without this pairing an `exp/` pull request landed
  # uncategorised in the "shipped" section, which reads as a delivered change.
  - label: "experimental"
    branch:
      - '/^exp\//'

exclude-labels:
  - "release"
  - "experimental"

template: |
  ## Changes

  $CHANGES
