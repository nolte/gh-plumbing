---
# These settings are synced to GitHub by https://probot.github.io/apps/settings/.
#
# The Probot Settings App reacts to push events that touch THIS file; changes
# to the upstream `_extends:` source (`commons-settings.yml`) do not trigger a
# fresh sync on their own. When a commons change should propagate, edit this
# file as well (a comment touch is enough) so the App re-runs the merge.
# Tracked by https://github.com/nolte/gh-plumbing/issues/331.
#
# Last propagation: 2026-09-13 — propagate the new `on-hold` label from
# commons-settings.yml. reusable-stale.yaml exempts `bug,wip,on-hold`, but
# neither `wip` nor `on-hold` had ever been declared, so that exemption only
# ever worked for `bug`. The label was also created directly through the API
# here rather than waiting for this sync: the stale caller was repaired the
# same day (#422) after 43 straight `startup_failure` runs, and its next
# scheduled run would have staled three live issues (#394, #387, #386).
#
# Previous propagation: 2026-08-01 (second) — propagate the new `experimental`
# label from commons-settings.yml so the Settings App creates it portfolio-wide.
# The `exp/` autolabeler in commons-release-drafter.yml is inert until the label
# exists in the repository it fires in.
#
# Previous propagation: 2026-08-01 — add the `actionlint / Workflow Lint` required
# context (issue #398). Verify the result through the API rather than the
# settings page: issue #387 found that five of nine consumers silently drift
# between declared and live protection, so a declaration landing here is not
# evidence that it applied.
#
# Previous propagation: 2026-07-22 — propagate new commons labels (frontend,
# backend, test, security) added to commons-settings.yml so the Settings
# App re-runs the `_extends` merge and creates them portfolio-wide.
#
# Previous propagation: 2026-06-14 — declare this repo's own required status
# checks on develop. commons-settings.yml leaves develop's
# `required_status_checks.contexts` empty by portfolio policy ("Consumers
# MUST declare their own required-check contexts in their per-repo
# .github/settings.yml"); the branches block below supplies them. Per the
# Probot Settings App `_extends` merge rules, branch entries merge by
# `name`, so declaring only `develop` here keeps the `master` block and
# develop's `enforce_admins` / `restrictions` from commons untouched.
# (Previous propagation 2026-05-20 — Phase 2 of #330: declare
# nolte-portfolio-app as branch-protection bypass actor on develop and
# master.)

_extends: gh-plumbing:.github/commons-settings.yml

repository:
  name: gh-plumbing
  description: Github Project plumbing
  homepage: https://nolte.github.io/gh-plumbing/
  topics: github, plumbing

branches:
  # Merges by `name` into the commons `develop` block; only
  # required_status_checks.contexts is overridden here. The check
  # contexts are "<caller-job-id> / <reusable-job-display-name>":
  # `static` job → reusable-pre-commit's "Static CI Tests";
  # `docs` job → reusable-mkdocs-build's "MkDocs Build";
  # `actionlint` job → reusable-actionlint's "Workflow Lint".
  - name: develop
    protection:
      required_status_checks:
        strict: true
        contexts:
          - static / Static CI Tests
          - docs / MkDocs Build
          - actionlint / Workflow Lint
      # Push restrictions are only available for organization-owned repositories
      # (GitHub REST, Update branch protection); the commons' apps restriction
      # makes the whole develop update fail with 422 on this user-owned repository,
      # so contexts declared after it never applied (nolte/gh-plumbing#416).
      restrictions: null
