---
# These settings are synced to GitHub by https://probot.github.io/apps/settings/.
#
# The Probot Settings App reacts to push events that touch THIS file; changes
# to the upstream `_extends:` source (`commons-settings.yml`) do not trigger a
# fresh sync on their own. When a commons change should propagate, edit this
# file as well (a comment touch is enough) so the App re-runs the merge.
# Tracked by https://github.com/nolte/gh-plumbing/issues/331.
#
# Last propagation: 2026-11-18 — commons-settings.yml no longer declares a
# `master` entry (#481, ADR-006): its `restrictions.apps` can't work on a
# user-owned repository, so GitHub rejects the master update and it applies
# nothing (documented limit; not re-observed for master). This file now
# declares `master` itself, with the values that are
# live today, so the sync changes nothing there. Verify through the API
# afterwards that `master` still reads enforce_admins true, no required
# checks, no required reviews, no restrictions.
#
# Previous propagation: 2026-11-17 (third) — require the commit status
# `fork-guard` on develop: posted from `pull_request_target`, so a fork can't
# rewrite it, it fails a fork pull request that changes what the other
# required checks execute (#465). Its workflow lands in the same change; the
# App applies the context on the push to develop, when that workflow already
# exists there. Verify through the API afterwards that all six contexts are
# live.
#
# Previous propagation: 2026-11-17 (second) — commons-settings.yml no longer
# declares a `develop` entry (#442, ADR-005): its `restrictions.apps` can't
# work on a user-owned repository, and arrays from `_extends` may be
# concatenated rather than merged by `name`, which would race this file's own
# entry. The develop entry below therefore carries the complete protection
# payload itself. Verify through the API afterwards that all contexts,
# `strict` and `enforce_admins` are still live.
#
# Previous propagation: 2026-11-17 — declare `required-check-triggers-tests /
# Python Coverage` as a required context on develop: the suite of the guard
# that refuses a required context fork pull requests can't report (#462).
# The App applied it on merge, as verified through the API on 2026-11-17.
# Earlier notes said the App doesn't sync contexts (#369). That was the
# commons `restrictions` 422 aborting the whole develop update, fixed in #416.
#
# Previous propagation: 2026-09-13 (second) — require the `pr-lint / PR Lint`
# context on develop. This repository ships reusable-pr-lint.yaml and did not
# run it: two consumers already require the check while the origin judged its
# own pull requests by nothing (#386). Verify through the API afterwards, not
# the settings page — #387 is exactly the case where a declaration lands here
# and does not apply.
#
# Previous propagation: 2026-09-13 — propagate the new `on-hold` label from
# commons-settings.yml. reusable-stale.yaml exempts `bug,wip,on-hold`, but
# neither `wip` nor `on-hold` had ever been declared, so that exemption only
# ever worked for `bug`. The label was also created directly through the API
# here rather than waiting for this sync: the stale caller was repaired the
# same day (#422) after 43 straight `startup_failure` runs, and its next
# scheduled run would have staled three live issues (#394, #387, #386).
#
# Previous propagation: 2026-08-01 (second) — propagate the new `experimental`
# label from commons-settings.yml so the Settings App creates it portfolio-wide.
# The `exp/` autolabeler in commons-release-drafter.yml is inert until the label
# exists in the repository it fires in.
#
# Previous propagation: 2026-08-01 — add the `actionlint / Workflow Lint` required
# context (issue #398). Verify the result through the API rather than the
# settings page: issue #387 found that five of nine consumers silently drift
# between declared and live protection, so a declaration landing here is not
# evidence that it applied.
#
# Previous propagation: 2026-07-22 — propagate new commons labels (frontend,
# backend, test, security) added to commons-settings.yml so the Settings
# App re-runs the `_extends` merge and creates them portfolio-wide.
#
# Previous propagation: 2026-06-14 — declare this repo's own required status
# checks on develop. commons-settings.yml leaves develop's
# `required_status_checks.contexts` empty by portfolio policy ("Consumers
# MUST declare their own required-check contexts in their per-repo
# .github/settings.yml"); the branches block below supplies them. (This
# note used to say branch entries merge by `name`. The current App source
# concatenates `_extends` arrays instead; #442 has the detail.)
# (Previous propagation 2026-05-20 — Phase 2 of #330: declare
# nolte-portfolio-app as branch-protection bypass actor on develop and
# master.)

_extends: gh-plumbing:.github/commons-settings.yml

repository:
  name: gh-plumbing
  description: Github Project plumbing
  homepage: https://nolte.github.io/gh-plumbing/
  topics: github, plumbing

branches:
  # The complete `develop` protection payload. The commons declare no
  # `develop` entry (#442, ADR-005), so nothing is inherited here: every
  # field the branch-protection API requires is set in this block. The check
  # contexts are "<caller-job-id> / <reusable-job-display-name>":
  # `static` job → reusable-pre-commit's "Static CI Tests";
  # `docs` job → reusable-mkdocs-build's "MkDocs Build";
  # `actionlint` job → reusable-actionlint's "Workflow Lint";
  # `pr-lint` job → reusable-pr-lint's "PR Lint";
  # `required-check-triggers-tests` job → reusable-python-coverage's
  # "Python Coverage" -- the suites of two guards: the one that refuses a
  # required context fork pull requests can't report (#462), and the one that
  # makes every actions/checkout decide `persist-credentials` (#471);
  # `fork-guard` is not a check run but the commit status that
  # reusable-fork-guard posts (fork-guard.yaml, `pull_request_target`). It
  # fails a fork pull request that changes the workflows, scripts or
  # configuration the contexts above run from, since those run from the
  # fork's own copy (#465). A status, because a fork can't write one; the
  # job's own check run, `fork-guard / Protected Paths`, is a name a fork's
  # workflow could report too.
  # The Settings App applies these contexts on the next push that touches
  # this file. Verify the live set through the API
  # (`gh api repos/nolte/gh-plumbing/branches/develop/protection/required_status_checks`),
  # since a failed App run is silent.
  - name: develop
    protection:
      required_pull_request_reviews: null
      required_status_checks:
        strict: true
        contexts:
          - static / Static CI Tests
          - docs / MkDocs Build
          - actionlint / Workflow Lint
          - pr-lint / PR Lint
          - required-check-triggers-tests / Python Coverage
          - fork-guard
      enforce_admins: true
      # Push restrictions are only available for organization-owned repositories
      # (GitHub REST, Update branch protection); the commons' apps restriction
      # used to make the whole develop update fail with 422 on this user-owned
      # repository, so contexts declared after it never applied
      # (nolte/gh-plumbing#416). The commons no longer declare it (#442).
      restrictions: null

  # The complete `master` protection payload. The commons declare no `master`
  # entry any more (#481, ADR-006): since #355 their `restrictions.apps` can't
  # be accepted on this user-owned repository, so that entry stopped applying
  # here. The values below mirror the live protection as read
  # through the API on 2026-11-18, so applying this entry changes nothing:
  # admins included, no required checks, no required reviews, no push
  # restriction. The fields not listed here (force pushes, deletions, linear
  # history and the other booleans of that endpoint) take the API's default
  # `false` on the full PUT,
  # which is also what is live. The release workflow keeps `master` current;
  # reusable-release-cd-refresh-master.yml reads this protection to choose
  # its write strategy. Verify through the API after the sync
  # (`gh api repos/nolte/gh-plumbing/branches/master/protection`).
  - name: master
    protection:
      required_pull_request_reviews: null
      required_status_checks: null
      enforce_admins: true
      restrictions: null
