repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-yaml
            args: ['--unsafe']
          - id: end-of-file-fixer
          - id: trailing-whitespace
            args: ['--markdown-linebreak-ext=md']
    - repo: local
      hooks:
          - id: label-description-length
            name: 'Label descriptions ≤100 chars (GitHub API limit, see #331)'
            entry: .github/scripts/check-label-descriptions.py
            language: python
            additional_dependencies: ['pyyaml']
            files: '^\.github/commons-settings\.yml$'
          - id: release-category-labels
            name: 'No area label selects a release-notes category (see #413, #475)'
            entry: .github/scripts/check-release-category-labels.py
            language: python
            additional_dependencies: ['pyyaml']
            files: '^\.github/commons-(release-drafter|boring-cyborg)\.yml$'
            pass_filenames: false
          # A combined `actions/cache` step saves in its post step, after
          # everything the job ran -- third-party code included -- could
          # rewrite the cached path, and it saves on every event, the default
          # branch's included. Found twice by sweep (#472, #476). Split steps
          # (`actions/cache/restore@` + `actions/cache/save@`) don't match;
          # neither do comment lines. A line-pattern hook is enough here: the
          # predicate is the `uses:` value alone, unlike checkout_credentials.py,
          # which has to pair a step with its `with:` keys and a later step.
          - id: no-combined-actions-cache
            name: 'No combined actions/cache step, split into restore + save (#472, #476)'
            language: pygrep
            entry: '^[^#]*\buses:\s*["'']?actions/cache@'
            files: '^(\.github/(workflows/[^/]+|actions/.+/action)|actions/.+/action)\.ya?ml$'
          - id: vale-version
            name: '.vale-version is self-consistent and agrees with .tool-versions (see #488)'
            entry: scripts/vale_version.py
            language: python
            files: '^(\.vale-version|\.tool-versions)$'
            pass_filenames: false
